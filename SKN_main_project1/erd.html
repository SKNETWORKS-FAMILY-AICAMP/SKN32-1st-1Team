<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ERD — sknmainproject1_db</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; font-family: 'Consolas', 'Courier New', monospace; overflow: hidden; }

    .title-bar {
      background: #16213e;
      color: #e2e8f0;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-bottom: 2px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
    }
    .title-bar span { color: #93c5fd; }

    .canvas-wrap {
      width: 100vw;
      height: calc(100vh - 44px);
      overflow: auto;
      cursor: grab;
    }
    .canvas-wrap:active { cursor: grabbing; }

    .canvas {
      position: relative;
      width: 2200px;
      height: 1280px;
    }

    svg.lines {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .tbl {
      position: absolute;
      width: 228px;
      background: #fff;
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .tbl-head {
      padding: 7px 11px;
      font-size: 11.5px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tbl-head.monthly { background: #1d4ed8; }
    .tbl-head.anchor  { background: #6d28d9; }
    .tbl-head.yearly  { background: #15803d; }
    .tbl-head.faq     { background: #7e22ce; }
    .tbl-head.cache   { background: #c2410c; }

    .col-row {
      display: flex;
      align-items: center;
      padding: 0 8px;
      height: 23px;
      border-bottom: 1px solid #f1f5f9;
      gap: 5px;
    }
    .col-row:last-child { border-bottom: none; }
    .col-row.pk-row { background: #fefce8; }
    .col-row.fk-row { background: #f0fdf4; }
    .col-row.uk-row { background: #eff6ff; }

    .key-badge {
      font-size: 8.5px;
      font-weight: 800;
      padding: 1px 3px;
      border-radius: 2px;
      min-width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .pk-badge { background: #fbbf24; color: #78350f; }
    .fk-badge { background: #86efac; color: #14532d; }
    .uk-badge { background: #93c5fd; color: #1e3a5f; }
    .no-badge { color: transparent; background: transparent; }

    .col-name { flex: 1; font-size: 11px; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .col-name.is-pk { color: #92400e; font-weight: 600; }
    .col-name.is-fk { color: #166534; font-weight: 600; }
    .col-type { font-size: 9.5px; color: #94a3b8; flex-shrink: 0; }

    .legend {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #16213e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 12px 14px;
      color: #e2e8f0;
      font-size: 11px;
      line-height: 1.8;
    }
    .legend-title { font-weight: bold; color: #93c5fd; margin-bottom: 6px; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .ld { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: #16213e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 8px 12px;
      color: #64748b;
      font-size: 10px;
    }
  </style>
</head>
<body>
<div class="title-bar">
  🗄️ ERD — <span>sknmainproject1_db</span> &nbsp;|&nbsp; MySQL 8.0 &nbsp;|&nbsp; 소나기팀 2026
</div>

<div class="canvas-wrap" id="wrap">
  <div class="canvas" id="canvas">
    <svg class="lines" id="svg"></svg>
  </div>
</div>

<div class="legend">
  <div class="legend-title">테이블 그룹</div>
  <div class="legend-item"><div class="ld" style="background:#1d4ed8"></div> 월별 통계 (7개)</div>
  <div class="legend-item"><div class="ld" style="background:#6d28d9"></div> 적재 이력 (기준키)</div>
  <div class="legend-item"><div class="ld" style="background:#15803d"></div> 연도별 통계</div>
  <div class="legend-item"><div class="ld" style="background:#7e22ce"></div> FAQ / 기업</div>
  <div class="legend-item"><div class="ld" style="background:#c2410c"></div> 캐시</div>
  <div style="margin-top:8px; border-top:1px solid #1e3a5f; padding-top:8px; color:#64748b;">
    <div>── FK (논리관계)</div>
    <div>—— FK (물리 외래키)</div>
  </div>
</div>

<div class="hint">스크롤로 이동</div>

<script>
const TW = 228, HEADER_H = 32, ROW_H = 23;

const TABLES = [
  {
    id: 'load_history', group: 'anchor', x: 756, y: 36,
    columns: [
      { name: 'id',          type: 'INT UNSIGNED', key: 'PK' },
      { name: 'year_months', type: 'CHAR(6)',      key: 'UK' },
      { name: 'filename',    type: 'VARCHAR(200)' },
      { name: 'loaded_at',   type: 'TIMESTAMP' },
      { name: 'row_count',   type: 'INT UNSIGNED' },
    ]
  },
  {
    id: 'car_yearly_stats', group: 'yearly', x: 1940, y: 36,
    columns: [
      { name: 'id',               type: 'INT UNSIGNED',  key: 'PK' },
      { name: 'stat_year',        type: 'YEAR' },
      { name: 'car_type',         type: 'ENUM' },
      { name: 'usage_type',       type: 'ENUM' },
      { name: 'registered_count', type: 'BIGINT UNSIGNED' },
      { name: 'created_at',       type: 'TIMESTAMP' },
    ]
  },
  /* ── 월별 통계 (left of load_history) ── */
  {
    id: 'car_region_stats', group: 'monthly', x: 36, y: 250,
    columns: [
      { name: 'id',           type: 'INT UNSIGNED', key: 'PK' },
      { name: 'year_months',  type: 'CHAR(6)',      key: 'FK' },
      { name: 'region',       type: 'VARCHAR(20)' },
      { name: 'car_type',     type: 'ENUM' },
      { name: 'cnt_official', type: 'INT UNSIGNED' },
      { name: 'cnt_private',  type: 'INT UNSIGNED' },
      { name: 'cnt_business', type: 'INT UNSIGNED' },
      { name: 'cnt_total',    type: 'INT UNSIGNED' },
      { name: 'created_at',   type: 'TIMESTAMP' },
    ]
  },
  {
    id: 'car_fuel_stats', group: 'monthly', x: 282, y: 250,
    columns: [
      { name: 'id',               type: 'INT UNSIGNED', key: 'PK' },
      { name: 'year_months',      type: 'CHAR(6)',      key: 'FK' },
      { name: 'region',           type: 'VARCHAR(20)' },
      { name: 'fuel_type',        type: 'ENUM(17종)' },
      { name: 'car_type',         type: 'ENUM' },
      { name: 'usage_type',       type: 'ENUM' },
      { name: 'registered_count', type: 'INT UNSIGNED' },
      { name: 'created_at',       type: 'TIMESTAMP' },
    ]
  },
  {
    id: 'car_gender_age_stats', group: 'monthly', x: 528, y: 250,
    columns: [
      { name: 'id',               type: 'INT UNSIGNED', key: 'PK' },
      { name: 'year_months',      type: 'CHAR(6)',      key: 'FK' },
      { name: 'region',           type: 'VARCHAR(20)' },
      { name: 'gender',           type: 'ENUM' },
      { name: 'age_group',        type: 'ENUM' },
      { name: 'registered_count', type: 'INT UNSIGNED' },
      { name: 'created_at',       type: 'TIMESTAMP' },
    ]
  },
  /* ── 월별 통계 (right of load_history) ── */
  {
    id: 'car_type_detail_stats', group: 'monthly', x: 1084, y: 250,
    columns: [
      { name: 'id',               type: 'INT UNSIGNED', key: 'PK' },
      { name: 'year_months',      type: 'CHAR(6)',      key: 'FK' },
      { name: 'region',           type: 'VARCHAR(20)' },
      { name: 'car_type',         type: 'ENUM' },
      { name: 'car_subtype',      type: 'VARCHAR(30)' },
      { name: 'registered_count', type: 'INT UNSIGNED' },
      { name: 'created_at',       type: 'TIMESTAMP' },
    ]
  },
  {
    id: 'car_displacement_stats', group: 'monthly', x: 1330, y: 250,
    columns: [
      { name: 'id',               type: 'INT UNSIGNED', key: 'PK' },
      { name: 'year_months',      type: 'CHAR(6)',      key: 'FK' },
      { name: 'region',           type: 'VARCHAR(20)' },
      { name: 'displacement',     type: 'ENUM(7구간)' },
      { name: 'registered_count', type: 'INT UNSIGNED' },
      { name: 'created_at',       type: 'TIMESTAMP' },
    ]
  },
  {
    id: 'car_new_registration', group: 'monthly', x: 1576, y: 250,
    columns: [
      { name: 'id',               type: 'INT UNSIGNED', key: 'PK' },
      { name: 'year_months',      type: 'CHAR(6)',      key: 'FK' },
      { name: 'region',           type: 'VARCHAR(20)' },
      { name: 'car_type',         type: 'ENUM' },
      { name: 'reg_type',         type: 'ENUM' },
      { name: 'registered_count', type: 'INT UNSIGNED' },
      { name: 'created_at',       type: 'TIMESTAMP' },
    ]
  },
  {
    id: 'car_age_stats', group: 'monthly', x: 1822, y: 250,
    columns: [
      { name: 'id',               type: 'INT UNSIGNED', key: 'PK' },
      { name: 'year_months',      type: 'CHAR(6)',      key: 'FK' },
      { name: 'model_year',       type: 'YEAR' },
      { name: 'car_type',         type: 'ENUM' },
      { name: 'usage_type',       type: 'ENUM' },
      { name: 'registered_count', type: 'INT UNSIGNED' },
      { name: 'created_at',       type: 'TIMESTAMP' },
    ]
  },
  /* ── FAQ 그룹 ── */
  {
    id: 'company_config', group: 'faq', x: 36, y: 800,
    columns: [
      { name: 'id',                  type: 'INT UNSIGNED',  key: 'PK' },
      { name: 'company_name',        type: 'VARCHAR(100)',  key: 'UK' },
      { name: 'company_url',         type: 'VARCHAR(500)' },
      { name: 'brand_type',          type: 'ENUM' },
      { name: 'keywords',            type: 'JSON' },
      { name: 'related_fuel',        type: 'VARCHAR(50)' },
      { name: 'related_car_type',    type: 'VARCHAR(50)' },
      { name: 'is_active',           type: 'TINYINT(1)' },
      { name: 'crawl_interval_days', type: 'TINYINT' },
      { name: 'last_crawled_at',     type: 'TIMESTAMP NULL' },
      { name: 'created_at',          type: 'TIMESTAMP' },
      { name: 'updated_at',          type: 'TIMESTAMP' },
    ]
  },
  {
    id: 'company_faq', group: 'faq', x: 420, y: 800,
    columns: [
      { name: 'id',                 type: 'INT UNSIGNED',  key: 'PK' },
      { name: 'company_id',         type: 'INT UNSIGNED',  key: 'FK' },
      { name: 'question',           type: 'TEXT' },
      { name: 'answer',             type: 'MEDIUMTEXT' },
      { name: 'category',           type: 'VARCHAR(100)' },
      { name: 'extracted_keywords', type: 'JSON' },
      { name: 'source_url',         type: 'VARCHAR(500)' },
      { name: 'crawled_at',         type: 'TIMESTAMP' },
      { name: 'is_valid',           type: 'TINYINT(1)' },
      { name: 'created_at',         type: 'TIMESTAMP' },
    ]
  },
  /* ── 캐시 ── */
  {
    id: 'trend_analysis_cache', group: 'cache', x: 810, y: 800,
    columns: [
      { name: 'id',              type: 'INT UNSIGNED', key: 'PK' },
      { name: 'analysis_type',   type: 'VARCHAR(100)' },
      { name: 'base_year_month', type: 'CHAR(6)' },
      { name: 'period_years',    type: 'TINYINT UNSIGNED' },
      { name: 'result_json',     type: 'JSON' },
      { name: 'trend_keyword',   type: 'VARCHAR(100)' },
      { name: 'created_at',      type: 'TIMESTAMP' },
      { name: 'expires_at',      type: 'TIMESTAMP' },
    ]
  },
];

// from, fromCol → to, toCol, physical(true=solid, false=dashed)
const CONNECTIONS = [
  ['car_region_stats',      'year_months', 'load_history', 'year_months', false],
  ['car_fuel_stats',        'year_months', 'load_history', 'year_months', false],
  ['car_gender_age_stats',  'year_months', 'load_history', 'year_months', false],
  ['car_type_detail_stats', 'year_months', 'load_history', 'year_months', false],
  ['car_displacement_stats','year_months', 'load_history', 'year_months', false],
  ['car_new_registration',  'year_months', 'load_history', 'year_months', false],
  ['car_age_stats',         'year_months', 'load_history', 'year_months', false],
  ['company_faq', 'company_id', 'company_config', 'id', true],
];

// ── Render tables ──────────────────────────────────────────
const canvas = document.getElementById('canvas');
const tblMap = {};

for (const tbl of TABLES) {
  const div = document.createElement('div');
  div.className = 'tbl';
  div.id = 'tbl-' + tbl.id;
  div.style.left = tbl.x + 'px';
  div.style.top  = tbl.y + 'px';

  const head = document.createElement('div');
  head.className = `tbl-head ${tbl.group}`;
  head.textContent = tbl.id;
  div.appendChild(head);

  for (const col of tbl.columns) {
    const row = document.createElement('div');
    row.className = 'col-row' +
      (col.key === 'PK' ? ' pk-row' : col.key === 'FK' ? ' fk-row' : col.key === 'UK' ? ' uk-row' : '');
    row.id = `col-${tbl.id}-${col.name}`;

    const badge = document.createElement('span');
    badge.className = 'key-badge ' + (col.key ? `${col.key.toLowerCase()}-badge` : 'no-badge');
    badge.textContent = col.key || '';

    const name = document.createElement('span');
    name.className = 'col-name' + (col.key === 'PK' ? ' is-pk' : col.key === 'FK' ? ' is-fk' : '');
    name.textContent = col.name;

    const type = document.createElement('span');
    type.className = 'col-type';
    type.textContent = col.type;

    row.appendChild(badge);
    row.appendChild(name);
    row.appendChild(type);
    div.appendChild(row);
  }

  canvas.appendChild(div);
  tblMap[tbl.id] = tbl;
}

// ── Draw connections ───────────────────────────────────────
function colY(tblId, colName) {
  const tbl = tblMap[tblId];
  const idx = tbl.columns.findIndex(c => c.name === colName);
  return tbl.y + HEADER_H + (idx + 0.5) * ROW_H;
}

function drawLines() {
  const svg = document.getElementById('svg');
  svg.innerHTML = `
    <defs>
      <marker id="dot-blue"  markerWidth="6" markerHeight="6" refX="3" refY="3">
        <circle cx="3" cy="3" r="2.5" fill="#60a5fa"/>
      </marker>
      <marker id="dot-purple" markerWidth="6" markerHeight="6" refX="3" refY="3">
        <circle cx="3" cy="3" r="2.5" fill="#c084fc"/>
      </marker>
      <marker id="crow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
        <path d="M0,1 L9,5 L0,9 M0,5 L9,5" stroke="#60a5fa" stroke-width="1.5" fill="none"/>
      </marker>
      <marker id="crow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
        <path d="M0,1 L9,5 L0,9 M0,5 L9,5" stroke="#c084fc" stroke-width="1.5" fill="none"/>
      </marker>
    </defs>`;

  const LH_CX = tblMap['load_history'].x + TW / 2;

  for (const [fromId, fromCol, toId, toCol, physical] of CONNECTIONS) {
    const from = tblMap[fromId];
    const to   = tblMap[toId];

    const y1 = colY(fromId, fromCol);
    const y2 = colY(toId, toCol);

    let x1, x2;
    const fromCX = from.x + TW / 2;

    if (fromCX < LH_CX) {
      // child is LEFT of load_history → connect right→left
      x1 = from.x + TW;
      x2 = to.x;
    } else if (toId === 'company_config') {
      // company_faq → company_config (faq is right of config)
      x1 = from.x;
      x2 = to.x + TW;
    } else {
      // child is RIGHT of load_history → connect left→right
      x1 = from.x;
      x2 = to.x + TW;
    }

    const color  = physical ? '#c084fc' : '#60a5fa';
    const dash   = physical ? 'none' : '6,3';
    const dotId  = physical ? 'dot-purple' : 'dot-blue';
    const crowId = physical ? 'crow-purple' : 'crow-blue';

    const mx = (x1 + x2) / 2;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-dasharray', dash);
    path.setAttribute('opacity', '0.75');
    path.setAttribute('marker-start', `url(#${dotId})`);
    path.setAttribute('marker-end',   `url(#${crowId})`);
    svg.appendChild(path);
  }
}

requestAnimationFrame(() => requestAnimationFrame(drawLines));

// ── Drag to scroll ─────────────────────────────────────────
const wrap = document.getElementById('wrap');
let dragging = false, sx, sy, sl, st;
wrap.addEventListener('mousedown', e => {
  dragging = true; sx = e.clientX; sy = e.clientY;
  sl = wrap.scrollLeft; st = wrap.scrollTop;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  wrap.scrollLeft = sl - (e.clientX - sx);
  wrap.scrollTop  = st - (e.clientY - sy);
});
window.addEventListener('mouseup', () => { dragging = false; });
</script>
</body>
</html>
